name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: "1"
      BASE_URL: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 시드 PDF는 저장소에 없다 (8541963 — 9편 중 1편이 재배포 불가). 테스트도
      # 골드셋 게이트도 실제 원문을 읽으므로 CI가 직접 받아야 한다.
      - name: Cache seed papers
        uses: actions/cache@v4
        with:
          path: papers/*.pdf
          # 목록이 바뀔 때만 다시 받는다 (arXiv에 매 실행 47MB를 요청하지 않는다)
          key: papers-${{ hashFiles('papers/papers.json') }}

      - name: Fetch seed papers
        run: python fetch_papers.py   # 이미 있으면 건너뛴다 (sha256 검증 포함)

      - name: obs self-check
        run: python obs.py

      - name: Unit tests
        run: pytest -q --ignore=tests/test_injection.py

      - name: Start MOCK server
        run: |
          python app.py &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/graph" >/dev/null 2>&1; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server never came up"; exit 1

      - name: Gold-set eval (gate)
        run: python eval_gold.py

      - name: Injection / safety tests
        run: pytest -q tests/test_injection.py

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
