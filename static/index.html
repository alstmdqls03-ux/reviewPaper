<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 논문 학습 챗봇</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='white'/%3E%3Ccircle cx='21' cy='20' r='2.4' fill='white'/%3E%3Cpath d='M13.6 13.8 19 18.4' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="cytoscape.min.js"></script>
<script src="cola.min.js"></script>
<script src="cytoscape-cola.js"></script>
<style>
  :root {
    --canvas:#16181c; --canvas-soft:#1e2126; --surface:#1e2126; --hairline:#343841;
    --on:#e9eaee; --on-mute:#b3b7c0; --ink-faint:#949aa5; --danger:#ff7b7b;
    /* 인터랙티브 요소의 보더는 --hairline(구분선용, 1.9:1)이 아니라 이걸 쓴다 — 비텍스트 대비 ≥3:1 */
    --border:#6b7078; --focus:#ffffff;
    --sans:'Inter', -apple-system, 'Arial Narrow', Arial, sans-serif;
    --radius-sm:8px; --radius-md:16px; --radius-pill:32px;
    --rail:300px; --studio:380px;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); color: var(--on); background: var(--canvas); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
  #app { display: flex; height: 100vh; }
  /* Chat pane */
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--canvas); }
  #chat header { padding: 16px 20px 0; background: var(--canvas); position: relative; z-index: 2; }
  #chat header h1 { font-size: 15px; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 1.4px; color: var(--on); }
  .hd-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .hd-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .hd-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .iconbtn { padding: 8px; min-width: 44px; min-height: 44px; border-radius: var(--radius-sm); }
  /* Tab bar (primary nav) */
  .tabbar { display: flex; gap: 18px; margin-top: 14px; border-bottom: 1px solid var(--hairline); }
  .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--on-mute); padding: 10px 8px; min-height: 44px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px; transition: color .15s ease, border-color .15s ease; }
  .tab:hover { background: transparent; color: var(--on); }
  .tab.active { color: var(--on); border-bottom-color: var(--on); }
  .tab .tabdot { width: 6px; height: 6px; border-radius: 50%; background: var(--on); margin-left: 6px; opacity: 0; transition: opacity .15s ease; }
  .tab.hasdot .tabdot { opacity: 1; }
  /* Tab content regions — one visible at a time */
  .tabwrap { flex: 1; display: flex; min-height: 0; }
  .tabpane { display: none; flex: 1; min-width: 0; min-height: 0; }
  .tabpane.active { display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 16px; max-width: 90%; animation: msgIn .2s ease both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { margin-left: auto; }
  .bubble { padding: 12px 15px; border-radius: 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .user .bubble { background: rgba(255,255,255,.06); border: 1px solid var(--hairline); color: var(--on); border-bottom-right-radius: 6px; }
  .bot .bubble { background: var(--canvas-soft); border: 1px solid var(--hairline); color: var(--on-mute); border-bottom-left-radius: 6px; }
  .bot .bubble.err { background: var(--canvas-soft); color: var(--danger); border-color: rgba(255,90,90,.45); }
  .cite { font-size: 11px; vertical-align: super; color: var(--on); cursor: help; margin: 0 1px; font-weight: 700; letter-spacing: .5px; }
  /* "사용한 소스" — 접힌 상태가 기본. 매 답변마다 논문 10편 제목을 펼쳐두면
     라벨이 답변보다 커진다(실측 116px vs 74px). 요약 한 줄만 두고 클릭 시 펼친다. */
  .usedsrc { font-size: 11px; color: var(--ink-faint); margin-bottom: 6px; letter-spacing: .7px; line-height: 1.5; }
  .usedsrc summary { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; list-style: none;
                     text-transform: uppercase; padding: 2px 0; }
  .usedsrc summary::-webkit-details-marker { display: none; }
  .usedsrc summary::after { content: '▾'; font-size: 9px; transition: transform .15s ease; }
  .usedsrc[open] summary::after { transform: rotate(180deg); }
  .usedsrc summary:hover { color: var(--on); }
  .usedsrc ol { margin: 4px 0 0; padding-left: 20px; text-transform: none; letter-spacing: normal;
                font-size: 11.5px; line-height: 1.6; color: var(--on-mute); }
  .sources { margin-top: 8px; font-size: 11px; color: var(--on-mute); }
  .srcrow { border-top: 1px solid var(--hairline); }
  .srchead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 6px 0; cursor: pointer; }
  .srchead:hover { color: var(--on); }
  .srctoggle { flex-shrink: 0; text-transform: uppercase; letter-spacing: .6px; font-size: 10px; color: var(--ink-faint); }
  .srcrow.open .srctoggle { color: var(--on); }
  .passage { display: none; padding: 2px 0 10px; font-size: 12px; line-height: 1.6; color: var(--on-mute); font-style: italic; border-left: 2px solid var(--border, #6b7078); padding-left: 12px; margin: 0 0 8px; }
  .srcrow.open .passage { display: block; }
  .cite { cursor: pointer; }
  .cite:hover { color: var(--on); }
  .empty { color: var(--on-mute); font-size: 13px; }
  .onboard { max-width: 520px; }
  .ob-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--on); margin-bottom: 14px; }
  .ob-steps { list-style: none; counter-reset: ob; padding: 0; margin: 0; }
  .ob-steps li { counter-increment: ob; position: relative; padding: 0 0 12px 30px; font-size: 13.5px; line-height: 1.55; color: var(--on-mute); }
  .ob-steps li::before { content: counter(ob); position: absolute; left: 0; top: 0; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--on); border: 1px solid var(--border, #6b7078); border-radius: 50%; }
  .ob-steps li b { color: var(--on); font-weight: 600; }
  .ob-hint { margin-top: 6px; font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .8px; }
  .cursor::after { content: '▋'; color: var(--on); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--hairline); background: var(--canvas); }
  #q { flex: 1; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); font-size: 15px; font-family: var(--sans); color: var(--on); background: var(--canvas-soft); transition: border-color .15s ease, box-shadow .15s ease; }
  #q::placeholder { color: var(--ink-faint); }
  #q:focus { outline: none; border-color: var(--on); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  /* ghost pill buttons */
  button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 20px; border: 1px solid var(--on); border-radius: var(--radius-pill); background: transparent; color: var(--on); font-size: 13px; font-family: var(--sans); font-weight: 700; text-transform: uppercase; letter-spacing: 1.17px; cursor: pointer; transition: background .15s ease, transform .1s ease, border-color .15s ease, color .15s ease; }
  button:hover { background: rgba(255,255,255,.08); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  button svg { flex-shrink: 0; }
  .suggest { padding: 0 20px 12px; }
  .suggest span { display: inline-flex; align-items: center; margin: 4px 4px 0 0; padding: 7px 14px; font-size: 12px; background: var(--canvas-soft); color: var(--on-mute); border: 1px solid var(--hairline); border-radius: var(--radius-pill); cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease; }
  .suggest span:hover { background: rgba(255,255,255,.06); color: var(--on); border-color: var(--on-mute); }
  #quizbar { padding: 0; display: none; }
  #quizbtn { width: 100%; margin-bottom: 10px; }
  /* Quiz overlay (takeover of chat pane) */
  #quiz { position: absolute; inset: 0; background: var(--canvas-soft); display: none; flex-direction: column; z-index: 5; border: 1px solid var(--hairline); }
  #quiz.open { display: flex; }
  #quiz header { padding: 16px 20px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; background: var(--canvas-soft); }
  #quiz header h1 { font-size: 15px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 1.2px; }
  #quizbody { flex: 1; overflow-y: auto; padding: 20px; }
  .qcard { border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; background: var(--canvas-soft); }
  .qcard .qnum { font-size: 11px; color: var(--on-mute); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .qcard .qtext { font-size: 15px; font-weight: 600; margin: 6px 0 8px; line-height: 1.6; color: var(--on); }
  .qcard .qsrc { font-size: 11px; color: var(--on-mute); margin-bottom: 12px; }
  .opt { display: block; padding: 11px 13px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 15px; cursor: pointer; line-height: 1.5; color: var(--on-mute); transition: background .15s ease, border-color .15s ease; }
  .opt:hover { background: rgba(255,255,255,.06); }
  .opt input { margin-right: 8px; accent-color: var(--on); }
  .opt.correct { background: rgba(255,255,255,.08); border-color: var(--on); color: var(--on); }
  .opt.wrong { border-color: var(--danger); color: var(--danger); opacity: .8; }
  .qresult { margin-top: 10px; font-size: 14px; }
  .qresult .mark { font-weight: 700; }
  .qresult .ok { color: var(--on); }
  .qresult .no { color: var(--danger); }
  .qresult .exp { color: var(--on-mute); margin: 6px 0; line-height: 1.6; }
  .review-link { display: inline-block; font-size: 12px; color: var(--on); cursor: pointer; text-decoration: underline; }
  #quizfoot { padding: 14px 16px; border-top: 1px solid var(--hairline); display: flex; gap: 8px; align-items: center; background: var(--canvas-soft); }
  #score { font-size: 13px; font-weight: 700; margin-right: auto; text-transform: uppercase; letter-spacing: 1px; color: var(--on); }
  .ghostbtn { background: transparent; color: var(--on); border: 1px solid var(--hairline); }
  .ghostbtn:hover { background: rgba(255,255,255,.08); border-color: var(--on); }
  /* Graph pane */
  #graphpane { position: relative; background: var(--canvas); overflow: hidden; }
  #graphtoolbar { position: absolute; top: 12px; right: 14px; z-index: 4; display: flex; gap: 6px; }
  .gbtn { padding: 7px 11px; min-height: 36px; font-size: 11px; letter-spacing: .8px; gap: 5px; background: rgba(22,24,28,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-color: var(--border, #6b7078); }
  #cy { width: 100%; height: 100%; }
  #graphempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-faint); pointer-events: none; }
  #panel { position: absolute; right: 0; top: 0; width: 280px; height: 100%; z-index: 5; background: var(--canvas-soft); border-left: 1px solid var(--hairline); padding: 20px; overflow-y: auto; transform: translateX(100%); transition: transform .2s ease; }
  #panel.open { transform: translateX(0); }
  #panelbody { padding-top: 22px; }
  #panel h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: var(--on); }
  #panel .kind { font-size: 11px; color: var(--on-mute); text-transform: uppercase; letter-spacing: 1px; }
  #panel p { font-size: 15px; line-height: 1.6; color: var(--on-mute); }
  #panel .src { font-size: 11px; color: var(--on-mute); border-top: 1px solid var(--hairline); padding-top: 8px; margin-top: 8px; }
  #panel .close { position: absolute; top: 12px; right: 14px; cursor: pointer; color: var(--on-mute); font-size: 18px; line-height: 1; transition: color .15s ease; }
  #panel .close:hover { color: var(--on); }
  #panel .collapse { position: absolute; top: 12px; right: 40px; cursor: pointer; color: var(--on-mute); font-size: 18px; line-height: 1; transition: color .15s ease, transform .2s ease; }
  #panel .collapse:hover { color: var(--on); }
  #panel.collapsed { height: 46px; overflow: hidden; }
  #panel.collapsed #panelbody { opacity: 0; }
  #panel.collapsed .collapse { transform: rotate(180deg); }
  .wiki-status { display: inline-block; margin: 2px 0 12px; padding: 3px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .8px; border-radius: var(--radius-pill); border: 1px solid var(--border, #6b7078); color: var(--on-mute); }
  .wiki-status.s-known { background: var(--on); color: var(--canvas); border-color: var(--on); }
  .wiki-status.s-due { border-style: dashed; color: var(--on); }
  .wiki-status.s-learning { color: var(--on); }
  .wiki-sec { border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 12px; }
  .wiki-sec > strong, .src > strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--ink-faint); margin-bottom: 8px; font-weight: 700; }
  .wikilinks { display: flex; flex-wrap: wrap; gap: 6px; }
  .wikilink { padding: 6px 10px; font-size: 12px; letter-spacing: normal; text-transform: none; font-weight: 500; gap: 6px; color: var(--on); background: var(--canvas-soft); border-color: var(--hairline); }
  .wikilink:hover { background: rgba(255,255,255,.08); border-color: var(--on-mute); }
  .wikilink .rel { font-size: 9px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-faint); }
  .understood { width: 100%; margin-top: 16px; padding: 11px 14px; font-size: 12px; }
  .understood.on { background: var(--on); color: var(--canvas); border-color: var(--on); }
  .understood.on:hover { background: #d9dbe1; }
  #graphlabel { position: absolute; top: 12px; left: 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--on-mute); background: rgba(22,24,28,.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 6px 10px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); }
  /* --- added: mastery / next_up / notes / upload --- */
  .hbtns { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .hbtns button { padding: 8px 13px; font-size: 12px; letter-spacing: 1px; }
  #metrics { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-faint); margin-top: 0; text-transform: uppercase; letter-spacing: .8px; }
  #metrics::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--on); box-shadow: 0 0 0 0 rgba(255,255,255,.5); animation: livePulse 2s ease-out infinite; flex-shrink: 0; }
  @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.5); } 70% { box-shadow: 0 0 0 6px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
  #dashboard { display: none; margin-bottom: 18px; }
  .dash-score { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid var(--on-mute); border-radius: var(--radius-md); background: var(--canvas-soft); }
  .dash-score b { font-size: 30px; font-weight: 800; color: var(--on); line-height: 1; }
  .dash-score span { font-size: 11px; color: var(--on-mute); text-transform: uppercase; letter-spacing: 1px; }
  .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dash-tile { padding: 12px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); background: var(--canvas-soft); }
  .dash-tile b { display: block; font-size: 20px; font-weight: 700; color: var(--on); }
  .dash-tile span { font-size: 10px; color: var(--on-mute); text-transform: uppercase; letter-spacing: .6px; }
  #nextup { padding: 0; display: none; }
  .nu-title { font-size: 11px; font-weight: 700; color: var(--on-mute); margin: 4px 0; text-transform: uppercase; letter-spacing: 1px; }
  .nu-item { display: flex; flex-direction: column; padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); background: var(--canvas-soft); cursor: pointer; transition: background .15s ease, border-color .15s ease, transform .1s ease; }
  .nu-item:hover { background: rgba(255,255,255,.06); border-color: var(--on-mute); }
  .nu-item strong { font-size: 13px; color: var(--on); }
  .nu-item span { font-size: 12px; color: var(--on-mute); margin-top: 2px; line-height: 1.5; }
  .notebtn { margin-top: 8px; padding: 6px 12px; font-size: 11px; letter-spacing: 1px; }
  .pane-toolbar { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
  .pane-toolbar button { padding: 8px 13px; font-size: 12px; letter-spacing: 1px; }
  #study { padding: 16px 20px; overflow-y: auto; }
  .study-hint { font-size: 12px; color: var(--ink-faint); margin-top: 12px; line-height: 1.6; }
  #notesbody { flex: 1; overflow-y: auto; padding: 20px; }
  .notecard { border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; background: var(--canvas-soft); }
  .notecard .ntext { font-size: 15px; line-height: 1.6; white-space: pre-wrap; color: var(--on-mute); }
  .notecard .nmeta { font-size: 11px; color: var(--on-mute); margin-top: 8px; text-transform: uppercase; letter-spacing: .8px; }
  /* --- 소스 패널 --- */
  #sourcesbody { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .srccount { margin-right: auto; align-self: center; font-size: 11px; color: var(--on-mute); text-transform: uppercase; letter-spacing: .8px; }
  .srcitem { display: flex; align-items: center; gap: 12px; border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; background: var(--canvas-soft); }
  .srcitem input[type=checkbox] { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--on); cursor: pointer; }
  .srcitem .stitle { flex: 1; min-width: 0; font-size: 14px; color: var(--on); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srcitem.off .stitle { color: var(--ink-faint); }
  .sbadge { flex-shrink: 0; font-size: 9px; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-faint); border: 1px solid var(--hairline); border-radius: var(--radius-pill); padding: 3px 8px; }
  .srcact { flex-shrink: 0; display: flex; gap: 2px; }
  .srcact span { padding: 4px 6px; font-size: 13px; color: var(--on-mute); cursor: pointer; border-radius: var(--radius-sm); transition: color .15s ease; }
  .srcact span:hover { color: var(--on); }
  .srcact span.del:hover { color: var(--danger); }
  .srcsort { padding: 8px 10px; font-size: 12px; font-family: var(--sans); color: var(--on); background: var(--canvas-soft); border: 1px solid var(--hairline); border-radius: var(--radius-pill); cursor: pointer; }
  /* 소스 툴바 한 줄: [전체체크] 개수…… [정렬▾] [＋] */
  #sources .pane-toolbar { align-items: center; justify-content: flex-start; gap: 6px; padding: 10px 14px; }
  .srcallbox { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--on); cursor: pointer; margin: 0; }
  #sources .srccount { margin-right: auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srciconbtn { flex-shrink: 0; padding: 8px; min-width: 36px; min-height: 36px; gap: 0; }
  .srcsortwrap { position: relative; flex-shrink: 0; }
  .srcsortmenu { display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 12; min-width: 132px;
                 background: var(--canvas-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; }
  .srcsortmenu.open { display: block; }
  .srcsortmenu button { display: flex; width: 100%; justify-content: flex-start; border: 0; border-radius: var(--radius-sm);
                        padding: 8px 10px; font-size: 12px; text-transform: none; letter-spacing: normal; font-weight: 500; }
  .srcsortmenu button[aria-checked="true"]::before { content: '✓'; margin-right: 6px; }
  .srcsortmenu button[aria-checked="false"]::before { content: ''; margin-right: 15px; }
  .srcitem.pending { opacity: .6; }
  .srcitem.pending .stitle::after { content: ' · 처리 중…'; color: var(--ink-faint); font-size: 11px; }
  .srcerr { border: 1px solid rgba(255,90,90,.45); color: var(--danger); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 10px; font-size: 13px; }
  .srcrename { flex: 1; min-width: 0; padding: 6px 10px; font-size: 14px; font-family: var(--sans); color: var(--on); background: var(--canvas); border: 1px solid var(--on); border-radius: var(--radius-sm); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 20; }
  .modal.open { display: flex; }
  .modalcard { background: var(--canvas-soft); border-radius: var(--radius-md); padding: 22px; width: 320px; max-width: 90%; border: 1px solid var(--hairline); }
  .modalcard h2 { font-size: 14px; font-weight: 800; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--on); }
  #uptitle { width: 100%; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 10px; font-family: var(--sans); color: var(--on); background: var(--canvas-soft); transition: border-color .15s ease, box-shadow .15s ease; }
  #uptitle::placeholder { color: var(--ink-faint); }
  #uptitle:focus { outline: none; border-color: var(--on); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .modalcard input[type=file] { width: 100%; font-size: 12px; margin-bottom: 12px; color: var(--on-mute); }
  .modalrow { display: flex; gap: 8px; justify-content: flex-end; }
  #upstatus { font-size: 12px; color: var(--on-mute); margin-top: 10px; }
  /* --- 원문 뷰어 --- */
  .viewer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 25;
            background: var(--canvas-soft); border-left: 1px solid var(--border);
            display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .vhead { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--hairline); }
  .vtitle { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--on); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vnav { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .vnav #vpage { font-size: 11px; color: var(--on-mute); min-width: 62px; text-align: center; text-transform: uppercase; letter-spacing: .8px; }
  .vbtn { padding: 8px 12px; min-width: 40px; font-size: 15px; }
  #vbody { flex: 1; overflow-y: auto; padding: 18px; font-size: 14px; line-height: 1.75; color: var(--on-mute); white-space: pre-wrap; word-break: break-word; }
  #vbody mark { background: var(--on); color: var(--canvas); padding: 1px 2px; border-radius: 3px; }
  .vnote { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .8px; padding: 0 18px 10px; }
  .srcopen { flex-shrink: 0; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-faint); cursor: pointer; border-bottom: 1px solid var(--hairline); }
  .srcopen:hover { color: var(--on); border-bottom-color: var(--on); }
  /* 인용 각주 호버 미리보기 */
  #citepop { position: fixed; z-index: 40; max-width: 380px; display: none; padding: 10px 13px;
             background: var(--canvas-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
             font-size: 12px; line-height: 1.6; color: var(--on-mute); box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  #citepop.show { display: block; }
  #citepop b { display: block; color: var(--on); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 5px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--canvas-soft); color: var(--on); border: 1px solid var(--hairline); padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; opacity: 0; transition: opacity .25s ease; pointer-events: none; z-index: 30; }
  #toast.show { opacity: .98; }
  #masterylegend { position: absolute; bottom: 12px; left: 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--on-mute); background: rgba(22,24,28,.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 12px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); line-height: 1.9; }
  #masterylegend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; border: 2px solid transparent; box-sizing: border-box; }
  /* --- added: account / history --- */
  #acct { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--on-mute); cursor: pointer; margin-top: 0; padding: 5px 12px; background: var(--canvas-soft); border: 1px solid var(--hairline); border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: .8px; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  #acct:hover { background: rgba(255,255,255,.06); color: var(--on); border-color: var(--on-mute); }
  #historybody { flex: 1; overflow-y: auto; padding: 20px; }
  .convcard { display: flex; align-items: center; gap: 10px; border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; cursor: pointer; background: var(--canvas-soft); transition: background .15s ease, border-color .15s ease; }
  .convcard:hover { background: rgba(255,255,255,.06); border-color: var(--on-mute); }
  .convcard.active { border-color: var(--on); background: rgba(255,255,255,.08); }
  .convcard.active .ctitle::before { content: '● '; color: var(--on); font-size: 9px; vertical-align: middle; }
  .convtitle { font-size: 13px; font-weight: 600; color: var(--on); max-width: 52ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convcard .cmain { flex: 1; min-width: 0; }
  .convcard .ctitle { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--on); }
  .convcard .cmeta { font-size: 11px; color: var(--on-mute); margin-top: 3px; text-transform: uppercase; letter-spacing: .8px; }
  .convcard .cdel { color: var(--on-mute); font-size: 15px; cursor: pointer; padding: 2px 4px; transition: color .15s ease; }
  #history .pane-toolbar { align-items: center; }
  .convsearch { flex: 1; min-width: 0; margin-right: auto; padding: 9px 12px; font-size: 13px; font-family: var(--sans);
                color: var(--on); background: var(--canvas-soft); border: 1px solid var(--hairline);
                border-radius: var(--radius-pill); }
  .convsearch::placeholder { color: var(--ink-faint); }
  .convsearch:focus { outline: none; border-color: var(--on); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .csnip { font-size: 12px; color: var(--on-mute); margin-top: 4px; line-height: 1.5;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .csnip mark { background: var(--on); color: var(--canvas); padding: 0 2px; border-radius: 2px; }
  .convcard .cdel:hover { color: var(--danger); }
  #acctname { width: 100%; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 12px; font-family: var(--sans); color: var(--on); background: var(--canvas-soft); transition: border-color .15s ease, box-shadow .15s ease; }
  #acctname::placeholder { color: var(--ink-faint); }
  #acctname:focus { outline: none; border-color: var(--on); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  #acctsync { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .acctsync-h { font-size: 12px; font-weight: 700; color: var(--on-mute); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .acctsync-l { display: block; font-size: 11px; color: var(--ink-faint); margin: 8px 0 4px; }
  .acctsync-code { display: flex; gap: 6px; }
  .acctsync-code code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 8px 10px; font-size: 11px; font-family: var(--mono, monospace); color: var(--on); background: var(--canvas-soft); border: 1px solid var(--hairline); border-radius: var(--radius-sm); }
  .acctsync-code input { flex: 1; min-width: 0; padding: 8px 10px; font-size: 12px; color: var(--on); background: var(--canvas-soft); border: 1px solid var(--hairline); border-radius: var(--radius-sm); font-family: var(--mono, monospace); }
  .acctsync-code button { flex-shrink: 0; padding: 8px 12px; font-size: 11px; letter-spacing: .5px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat-grid .cell { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--radius-sm); padding: 10px 12px; }
  .stat-grid .cell b { display: block; font-size: 18px; font-weight: 700; color: var(--on); }
  .stat-grid .cell span { font-size: 11px; color: var(--on-mute); text-transform: uppercase; letter-spacing: .8px; }
  .cohort-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-top: 1px solid var(--hairline); color: var(--on-mute); }
  .cohort-row span:last-child { color: var(--on-mute); }
  /* Responsive: stack panes vertically under 900px */
  @media (max-width: 900px) {
    #app { flex-direction: column; height: 100vh; }
    #graphtoolbar { top: 8px; right: 8px; }
  }
  /* --- 다단 레이아웃 ---------------------------------------------------------
     좁은 화면에서는 지금처럼 탭 하나씩. 넓어지면 같은 DOM을 고정 열로 승격한다:
     ≥1100px = 소스 레일 + 본문, ≥1500px = 소스 레일 + 본문 + 그래프.
     열로 승격된 뷰는 탭 버튼을 숨긴다(같은 것을 두 군데서 열 수 있으면 헷갈린다). */
  @media (min-width: 1100px) {
    #sources.tabpane { display: flex; flex-direction: column; flex: 0 0 var(--rail);
                       order: -1; border-right: 1px solid var(--border); }  /* 왼쪽 열로 */
    #sources .pane-toolbar { flex-wrap: nowrap; }  /* 한 줄에 들어가도록 접었다 — 아래 srccount가 줄어든다 */
    #sourcesopen, #srcclose { display: none; }   /* 항상 보이므로 열기/닫기 버튼이 필요 없다 */
    #sources .railhead { display: block; }
  }
  @media (min-width: 1500px) {
    #graphpane.tabpane { display: flex; order: 1; flex: 0 0 var(--studio);
                         border-left: 1px solid var(--border); }
    .tab[data-tab="graph"] { display: none; }
    #graphlabel { display: none; }   /* 380px 열에서는 안내문이 캔버스를 다 덮는다 */
  }
  .railhead { display: none; padding: 14px 20px 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; color: var(--on); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .msg { animation: none; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="chat">
    <header>
      <div class="hd-row">
        <div class="hd-title">
          <h1>리뷰 논문 학습 챗봇</h1>
          <div id="convtitle" class="convtitle" title="현재 대화">새 대화</div>
          <div id="metrics"></div>
        </div>
        <div class="hd-actions">
          <button type="button" class="iconbtn" id="newconv" title="새 대화"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" class="iconbtn" id="uploadopen" title="논문 추가"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15h6"/></svg></button>
          <span id="acct" title="닉네임 설정"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="acctlabel">익명</span></span>
        </div>
      </div>
      <nav class="tabbar" role="tablist" aria-label="주요 탐색">
        <button type="button" class="tab active" data-tab="chat" role="tab" aria-selected="true">대화</button>
        <button type="button" class="tab" data-tab="sources" id="sourcesopen" role="tab" aria-selected="false">소스</button>
        <button type="button" class="tab" data-tab="graph" role="tab" aria-selected="false">그래프</button>
        <button type="button" class="tab" data-tab="study" role="tab" aria-selected="false">학습<span class="tabdot"></span></button>
        <button type="button" class="tab" data-tab="notes" id="notesopen" role="tab" aria-selected="false">노트</button>
        <button type="button" class="tab" data-tab="history" id="historyopen" role="tab" aria-selected="false">기록</button>
      </nav>
    </header>

    <div class="tabwrap">
      <!-- 대화 -->
      <div class="tabpane active" role="tabpanel" aria-label="대화" data-pane="chat">
        <div id="log"><div class="empty">아래 질문을 눌러보거나 직접 물어보세요.</div></div>
        <div class="suggest" id="suggest"></div>
      </div>
      <!-- 소스 -->
      <div class="tabpane" role="tabpanel" aria-label="소스" data-pane="sources" id="sources">
        <div class="railhead">소스</div>
        <!-- 300px 레일에 컨트롤 5개는 안 들어간다(실측 3줄 143px). 전체선택/해제는
             체크박스 하나로 합치고, 정렬은 아이콘 버튼이 여는 메뉴로 접었다. -->
        <div class="pane-toolbar">
          <input type="checkbox" id="srctoggleall" class="srcallbox" aria-label="전체 선택/해제" title="전체 선택/해제">
          <span id="srccount" class="srccount"></span>
          <div class="srcsortwrap">
            <button type="button" class="ghostbtn srciconbtn" id="srcsortbtn" aria-haspopup="true" aria-expanded="false" title="정렬" aria-label="정렬"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h9M3 18h5"/><path d="M18 9v10M15 16l3 3 3-3"/></svg></button>
            <div class="srcsortmenu" id="srcsortmenu" role="menu"></div>
          </div>
          <button type="button" class="ghostbtn srciconbtn" id="srcadd" title="논문 추가" aria-label="논문 추가"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" class="ghostbtn" id="srcclose">대화로</button>
        </div>
        <select id="srcsort" class="srcsort" aria-label="소스 정렬" hidden>
          <option value="added">추가순</option>
          <option value="title">제목순</option>
          <option value="mine">내 업로드 먼저</option>
        </select>
        <div id="sourcesbody"></div>
      </div>
      <!-- 학습 -->
      <div class="tabpane" role="tabpanel" aria-label="학습" data-pane="study" id="study">
        <div id="dashboard"></div>
        <div id="nextup"></div>
        <div id="quizbar"><button id="quizbtn" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>지금까지 배운 걸로 퀴즈 풀기</button></div>
        <div class="study-hint">개념을 학습할수록 “다음에 공부할 개념”과 퀴즈가 여기에 나타납니다.</div>
      </div>
      <!-- 노트 -->
      <div class="tabpane" role="tabpanel" aria-label="노트" data-pane="notes" id="notes">
        <div class="pane-toolbar">
          <button type="button" class="ghostbtn" id="notesexport"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Markdown 내보내기</button>
          <button type="button" class="ghostbtn" id="notesclose">대화로</button>
        </div>
        <div id="notesbody"></div>
      </div>
      <!-- 기록 -->
      <div class="tabpane" role="tabpanel" aria-label="기록" data-pane="history" id="history">
        <div class="pane-toolbar">
          <input id="convsearch" class="convsearch" type="search" autocomplete="off"
                 placeholder="대화 검색 (본문까지)" aria-label="대화 검색">
          <button type="button" class="ghostbtn" id="historystats"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M8 17V9"/><path d="M13 17V5"/><path d="M18 17v-6"/></svg>통계</button>
          <button type="button" class="ghostbtn" id="historyclose">대화로</button>
        </div>
        <div id="historybody"></div>
      </div>
      <!-- 그래프 -->
      <div class="tabpane" role="tabpanel" aria-label="그래프" data-pane="graph" id="graphpane">
        <div id="graphtoolbar">
          <button type="button" class="gbtn" id="gfit" title="맞춤 (전체 보기)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>맞춤</button>
          <button type="button" class="gbtn" id="grelayout" title="재배치 (다시 정리)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6M21 12A9 9 0 0 0 6 5.3L3 8"/><path d="M21 22v-6h-6M3 12a9 9 0 0 0 15 6.7l3-2.7"/></svg>재배치</button>
          <button type="button" class="gbtn" id="gclose" title="모두 닫기 (패널 닫고 맞춤)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>모두 닫기</button>
        </div>
        <div id="graphlabel">개념 그래프 — 노드를 클릭하면 설명·출처가 나와요</div>
        <div id="cy"></div>
        <div id="graphempty">대화를 시작하면 개념 지도가 자라납니다</div>
        <div id="masterylegend">
          <div><span class="dot" style="border-color:#e9eaee;background:#e9eaee;"></span>학습 완료</div>
          <div><span class="dot" style="border-color:#8b919d;background:#1e2126;"></span>학습 중</div>
          <div><span class="dot" style="border-color:#e9eaee;background:#1e2126;border-style:dashed;"></span>복습 필요</div>
        </div>
        <div id="panel">
          <span class="collapse" onclick="togglePanel()" title="접기/펴기">⌄</span>
          <span class="close" onclick="closePanel()" title="닫기">×</span>
          <div id="panelbody"></div>
        </div>
      </div>
    </div>

    <form id="f">
      <input id="q" placeholder="논문에 대해 질문하기…" autocomplete="off">
      <button id="send">전송</button>
    </form>

    <!-- Quiz takeover -->
    <div id="quiz">
      <header>
        <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>개념 퀴즈</h1>
        <button type="button" class="ghostbtn" id="quizclose">다시 대화로</button>
      </header>
      <div id="quizbody"></div>
      <div id="quizfoot">
        <span id="score"></span>
        <button type="button" id="quizsubmit">채점하기</button>
      </div>
    </div>
  </div>
</div>

<!-- PDF upload modal -->
<div id="uploadmodal" class="modal">
  <div class="modalcard">
