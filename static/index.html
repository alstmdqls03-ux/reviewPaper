<script>
// 선택한 소스에서 뽑은 추천 질문이 오기 전까지 쓰는 기본값.
let SUGGESTIONS = [
  "EM 이미지 딥러닝 세그멘테이션 정확도를 좌우하는 요인은?",
  "왜 딥러닝 세그멘테이션이 이미징 조건·메타데이터 기록에 의존하나?",
  "메타데이터 표준(FAIR)이 재현성에 왜 필요한가?",
  "이 리뷰들은 어노테이션 부담 문제를 각각 어떻게 접근하나?"
];
const log = document.getElementById('log');
const suggest = document.getElementById('suggest');

// C-c: study-guide onboarding (research-backed 5-step flow), shown as the chat empty state.
const ONBOARD = `<div class="empty onboard">
  <div class="ob-title">이 논문, 이렇게 공부해보세요</div>
  <ol class="ob-steps">
    <li><b>훑기</b> — 초록·그림·결론을 먼저 보고 궁금한 점 3개를 정해요.</li>
    <li><b>질문하며 읽기</b> — 아래 질문을 누르거나 직접 물어보세요. 답변엔 원문 인용이 달리고, 클릭하면 구절이 펼쳐져요.</li>
    <li><b>이해 확정</b> — 그래프에서 개념을 “이해했어요”로 체크하면 지도가 흰색으로 채워져요.</li>
    <li><b>퀴즈로 복습</b> — 배운 개념이 쌓이면 간격반복 퀴즈가 열려요. 오답은 다시 복습으로 돌아와요.</li>
  </ol>
  <div class="ob-hint">아래 추천 질문으로 시작해보세요 ↓</div>
</div>`;
log.innerHTML = ONBOARD;
function renderSuggestions(){
  suggest.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const el = document.createElement('span');
    el.textContent = s;
    el.onclick = () => { document.getElementById('q').value = s; send(); };
    suggest.appendChild(el);
  });
}
renderSuggestions();

// 추천 질문은 "지금 체크된 소스"에서 뽑는다 — 소스를 바꾸면 질문도 바뀐다.
async function refreshSuggestions(){
  try {
    const ids = (typeof SOURCES !== 'undefined' && SOURCES.length) ? selectedIds() : [];
    const r = await fetch('/suggestions?sources=' + encodeURIComponent(ids.join(',')), { headers: hdr() });
    if(!r.ok) return;
    const d = await r.json();
    if(d.suggestions && d.suggestions.length){ SUGGESTIONS = d.suggestions; renderSuggestions(); }
  } catch(e){ /* 기본 추천을 그대로 쓴다 */ }
}

// 답변 직후의 후속 질문. /suggestions는 "아직 안 배운 개념 먼저"로 정렬해 주므로
// 방금 답변이 다룬 개념(covered)으로 시작하는 질문만 걸러내면 다음 것이 남는다.
async function followUpSuggestions(covered){
  await refreshSuggestions();
  const done = new Set((covered || []).map(c => (NODE_BY_ID[c] || {}).label || '').filter(Boolean));
  if(done.size){
    const rest = SUGGESTIONS.filter(s => ![...done].some(l => s.startsWith(l.split(' /')[0])));
    if(rest.length) { SUGGESTIONS = rest; renderSuggestions(); }
  }
  suggest.style.display = SUGGESTIONS.length ? '' : 'none';
}

// ---- Tabs + hash router (안정 URL: /#/chat, /#/chat/{conv_id}, /#/graph/{concept} …) ----
const ROUTES = ['chat', 'sources', 'graph', 'study', 'notes', 'history'];
let RENDERED_CONV = null;  // 지금 채팅 로그에 그려져 있는 conversation_id (없으면 null)

// 화면이 넓어서 고정 열로 승격된 뷰는 목적지가 아니다 — 이미 항상 보이므로 chat으로 보낸다.
function isRail(name){
  if(name === 'sources') return matchMedia('(min-width: 1100px)').matches;
  if(name === 'graph')   return matchMedia('(min-width: 1500px)').matches;
  return false;
}

function showTab(name){
  document.querySelectorAll('#chat .tab').forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    if(on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  document.querySelectorAll('#chat .tabpane').forEach(p => p.classList.toggle('active', p.dataset.pane === name));
  document.getElementById('f').style.display = name === 'chat' ? 'flex' : 'none'; // input only on 대화
  if(name === 'study'){ const st = document.querySelector('.tab[data-tab="study"]'); if(st) st.classList.remove('hasdot'); }
  // Cytoscape was hidden (display:none → 0px); resize + reframe once its pane is visible.
  if(name === 'graph' && cy){ cy.resize(); runPhysics(true); }
}

function parseHash(){
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const [name, ...rest] = raw.split('/');
  return { name: ROUTES.includes(name) ? name : 'chat', arg: rest.length ? decodeURIComponent(rest.join('/')) : '' };
}

// 뷰 이동은 전부 여기로. hash를 바꾸면 hashchange -> applyRoute가 실제 렌더를 한다
// (뒤로가기가 그냥 동작하고, 새로고침해도 같은 화면이 나온다).
let routing = false;
function navigate(name, arg){
  if(isRail(name)) name = 'chat';
  const want = '#/' + name + (arg ? '/' + encodeURIComponent(arg) : '');
  if(location.hash === want) applyRoute(); else location.hash = want;
}

function applyRoute(){
  if(routing) return;
  routing = true;
  try {
    let { name, arg } = parseHash();
    if(isRail(name)){ name = 'chat'; arg = ''; }
    showTab(name);
    if(name === 'sources'){ SRC_ERROR = ''; loadSources(); }
    else if(name === 'notes') openNotes();
    else if(name === 'history') loadConversations();
    else if(name === 'graph' && arg) focusConcept(arg);
    // RENDERED_CONV = 지금 로그에 실제로 그려져 있는 대화. localStorage로 판정하면
    // 새로고침 직후(저장값은 있는데 로그는 비어 있는 상태)에 재생을 건너뛴다.
    else if(name === 'chat' && arg && arg !== RENDERED_CONV) resumeConversation(arg);
    else if(name === 'chat' && !arg && getConv() && !RENDERED_CONV) navigate('chat', getConv());
  } finally { routing = false; }
}
window.addEventListener('hashchange', applyRoute);

document.querySelector('.tab[data-tab="chat"]').onclick = () => navigate('chat', getConv() || '');
document.querySelector('.tab[data-tab="graph"]').onclick = () => navigate('graph');
document.querySelector('.tab[data-tab="study"]').onclick = () => navigate('study');

// 레일로 승격/강등될 때 그래프 캔버스 크기를 다시 잡아준다.
let resizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if(cy) cy.resize(); if(isRail(parseHash().name)) applyRoute(); }, 200);
});

// ---- Graph toolbar: 맞춤 / 재배치 / 모두 닫기, and concept-panel 접기/펴기 ----
function fitGraph(){ if(cy && cy.nodes().length) cy.animate({ fit:{ eles:cy.nodes(), padding:70 } }, { duration:300 }); }
function togglePanel(){ document.getElementById('panel').classList.toggle('collapsed'); }
document.getElementById('gfit').onclick = fitGraph;
document.getElementById('grelayout').onclick = () => { if(cy) runPhysics(true); };
document.getElementById('gclose').onclick = () => { closePanel(); fitGraph(); };
// #notesopen / #historyopen tab buttons keep their existing onclick (openNotes / openHistory below),
// which delegate to showTab('notes') / showTab('history') and load their data.

function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function getSession(){ return localStorage.getItem('rp_session'); }
function setSession(id){ if(id) localStorage.setItem('rp_session', id); }
// conversation_id threads a persisted conversation; sent back on every /chat in the same thread.
function getConv(){ return localStorage.getItem('rp_conv'); }
function setConv(id){ if(id) localStorage.setItem('rp_conv', id); }

// Device id = the learner across sessions. Sent as X-Device-Id on every fetch.
function getDevice(){
  let d = localStorage.getItem('rp_device');
  if(!d){
    d = [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
    localStorage.setItem('rp_device', d);
  }
  return d;
}
const DEVICE = getDevice();
function hdr(extra){ return Object.assign({'X-Device-Id': DEVICE}, extra||{}); }

// Small bottom toast.
let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

function addUser(text){
  const wrap = document.createElement('div'); wrap.className='msg user';
  wrap.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  log.appendChild(wrap); log.scrollTop = log.scrollHeight;
  suggest.style.display = 'none'; // 답변이 오는 동안만 숨긴다 — done에서 다시 채운다
}

// Builds a streaming bot bubble; returns handlers to feed it incrementally.
function newBotBubble(){
  const wrap = document.createElement('div'); wrap.className='msg bot';
  const usedBox = document.createElement('details'); usedBox.className='usedsrc'; usedBox.style.display='none';
  const bubble = document.createElement('div'); bubble.className='bubble cursor';
  const srcBox = document.createElement('div'); srcBox.className='sources'; srcBox.style.display='none';
  const noteBtn = document.createElement('button');
  noteBtn.type='button'; noteBtn.className='notebtn'; noteBtn.textContent='📌 노트 저장'; noteBtn.style.display='none';
  wrap.appendChild(usedBox); wrap.appendChild(bubble); wrap.appendChild(srcBox); wrap.appendChild(noteBtn);
  log.appendChild(wrap); log.scrollTop = log.scrollHeight;
  let html = '', n = 0;
  let plain = '', firstCite = null, concepts = [];
  const cites = {};   // n -> citation payload (뷰어/미리보기가 참조)
  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  noteBtn.onclick = () => saveNote(plain, firstCite, concepts[0] || null, noteBtn);
  // C-b: click a source row to expand its cited passage; click an inline [n] to jump+expand.
  srcBox.onclick = e => {
    const open = e.target.closest('.srcopen');
    if(open){
      e.stopPropagation();
      const c = cites[open.closest('.srcrow').dataset.n] || {};
      openViewer(c.source_id, c.start_page || 1, c.cited_text || '');
      return;
    }
    const row = e.target.closest('.srcrow'); if(row) row.classList.toggle('open');
  };
  bubble.onclick = e => {
    const s = e.target.closest('.cite'); if(!s) return;
    const row = srcBox.querySelector('.srcrow[data-n="'+s.dataset.n+'"]');
    if(row){ row.classList.add('open'); row.scrollIntoView({block:'nearest', behavior:'smooth'}); }
    const c = cites[s.dataset.n];
    if(c && c.source_id) openViewer(c.source_id, c.start_page || 1, c.cited_text || '');
  };
  // 호버하면 그 인용의 제목·쪽·구절을 바로 보여준다 (펼치러 내려가지 않아도 되게)
  bubble.addEventListener('mouseover', e => {
    const s = e.target.closest('.cite'); if(!s) return;
    const c = cites[s.dataset.n]; if(c) showCitePop(s, c);
  });
  bubble.addEventListener('mouseout', e => { if(e.target.closest('.cite')) hideCitePop(); });
  return {
    // "보낸 소스" — 이 답변을 만들 때 모델에 넘긴 논문 목록.
    // "사용한"이 아니라 "보낸"이다: 모델이 그중 무엇을 실제로 인용했는지는 각주가 말한다.
    // 접힌 요약 한 줄이 기본이고, 제목 전문은 <details>를 열어야 나온다.
    usedSources(titles){
      if(!titles || !titles.length) return;
      usedBox.innerHTML = `<summary>보낸 소스 ${titles.length}편</summary><ol>` +
        titles.map(t => `<li>${esc(t)}</li>`).join('') + '</ol>';
      usedBox.style.display = '';
    },
    text(delta){
      const stick = atBottom();
      plain += delta;
      html += esc(delta);
      bubble.innerHTML = html;
      bubble.classList.add('cursor');
      if(stick) log.scrollTop = log.scrollHeight;
    },
    citation(c){
      n++;
      cites[n] = c;
      if(!firstCite) firstCite = c.title || null;
      const page = c.start_page ? `p.${c.start_page}${c.end_page && c.end_page!==c.start_page ? '–'+c.end_page : ''}` : '';
      // title 속성을 쓰지 않는다 — 호버하면 #citepop이 같은 내용을 이미 띄우고,
      // 1초 뒤 브라우저 기본 툴팁이 그 위에 겹쳐 같은 제목·쪽이 두 겹으로 보였다.
      // 스크린리더용 이름은 aria-label로 남긴다.
      html += `<sup class="cite" data-n="${n}" role="button" tabindex="0" `+
              `aria-label="${esc(`인용 ${n}: ${c.title||''} ${page}`.trim())}">[${n}]</sup>`;
      bubble.innerHTML = html; bubble.classList.add('cursor');
      const row = document.createElement('div');
      row.className = 'srcrow'; row.dataset.n = n;
      const passage = (c.cited_text||'').trim();
      row.innerHTML = `<div class="srchead"><span>[${n}] ${esc(`${c.title||''} ${page}`.trim())}</span>`+
        (c.source_id?`<span class="srcopen">원문 쪽 열기</span>`:'')+
        (passage?`<span class="srctoggle">구절 보기</span>`:'')+`</div>`+
        (passage?`<div class="passage">“${esc(passage)}”</div>`:'');
      srcBox.appendChild(row); srcBox.style.display='';
    },
    done(cs){ bubble.classList.remove('cursor'); if(cs) concepts = cs; if(plain.trim()) noteBtn.style.display=''; },
    error(m){ bubble.classList.remove('cursor'); bubble.classList.add('err'); bubble.textContent = m; }
  };
}

async function send(){
  const q = document.getElementById('q');
  const text = q.value.trim(); if(!text) return;
  if(SOURCES.length && !selectedIds().length){ toast('소스를 1개 이상 선택하세요'); return; }
  const empty = log.querySelector('.empty'); if(empty) empty.remove();
  addUser(text); q.value='';
  if(!getConv()) setConvTitle(text.slice(0, 40));  // 서버 자동 제목과 같은 규칙
  const btn = document.getElementById('send'); btn.disabled = true;
  const bot = newBotBubble();
  try {
    const r = await fetch('/chat', {
      method:'POST', headers: hdr({'Content-Type':'application/json'}),
      body: JSON.stringify({session_id: getSession(), conversation_id: getConv(),
                            message: text, sources: selectedIds()})
    });
    if(!r.ok || !r.body){ bot.error('오류: ' + r.status); return; }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for(;;){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while((idx = buf.indexOf('\n\n')) !== -1){
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for(const line of chunk.split('\n')){
          const s = line.trim();
          if(!s.startsWith('data:')) continue;
          const payload = s.slice(5).trim();
          if(!payload || payload === '[DONE]') continue;
          let ev; try { ev = JSON.parse(payload); } catch(e){ continue; }
          handleEvent(ev, bot);
        }
      }
    }
    bot.done();
  } catch(e){ bot.error('요청 실패: ' + e); }
  finally { btn.disabled = false; }
}

function handleEvent(ev, bot){
  switch(ev.type){
    case 'session': {
      setSession(ev.session_id); setConv(ev.conversation_id);
      RENDERED_CONV = ev.conversation_id;
      // 첫 메시지로 대화가 생기면 URL도 그 대화를 가리키게 한다 (replaceState:
      // 스트리밍 중에 뒤로가기 히스토리를 더럽히지 않으려고).
      const want = '#/chat/' + encodeURIComponent(ev.conversation_id);
      if(location.hash !== want) history.replaceState(null, '', want);
      break;
    }
    case 'sources': bot.usedSources(ev.titles || []); break;
    case 'text': bot.text(ev.text || ''); break;
    case 'citation': bot.citation(ev.citation || {}); break;
    case 'done':
      bot.done(ev.concepts || []);
      revealConcepts(ev.concepts || []); // grow the map before highlighting so the nodes exist
      highlightConcepts(ev.concepts || []);
      if(ev.quiz_available){
        document.getElementById('quizbar').style.display = 'block';
        const st = document.querySelector('.tab[data-tab="study"]'); if(st && !st.classList.contains('active')) st.classList.add('hasdot');
      }
      refreshMastery();
      // 답변이 끝나면 다음에 물을 질문을 다시 채운다. 전에는 첫 질문에서 칩이
      // 사라진 뒤 ＋(새 대화)를 누르기 전까지 다시 나타나지 않았다.
      // 방금 다룬 개념은 빼고 뽑아, 같은 질문을 다시 권하지 않는다.
      followUpSuggestions(ev.concepts || []);
      { const he = document.getElementById('history'); if(he && he.classList.contains('active')) loadConversations(); } // keep list fresh if open
      break;
    case 'error': bot.error('오류: ' + (ev.message || '알 수 없는 오류')); break;
  }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); send(); });

// ---- Quiz ----
let currentQuiz = null; // {quiz_id, questions}
const quizEl = document.getElementById('quiz');
const quizBody = document.getElementById('quizbody');

document.getElementById('quizbtn').onclick = openQuiz;
document.getElementById('quizclose').onclick = closeQuiz;
document.getElementById('quizsubmit').onclick = gradeQuiz;

function closeQuiz(){ quizEl.classList.remove('open'); navigate('chat', getConv() || ''); }

async function openQuiz(){
  const sid = getSession();
  if(!sid){ alert('조금 더 대화한 뒤에 퀴즈를 볼 수 있어요'); return; }
  // 채팅과 같은 가드. 전에는 퀴즈만 빠져나가서, 소스를 전부 해제한 직후에도
  // 10편 전체에서 문제가 생성되고 해제한 논문 제목이 "출처:"에 찍혔다.
  if(SOURCES.length && !selectedIds().length){ toast('소스를 1개 이상 선택하세요'); return; }
  const btn = document.getElementById('quizbtn'); btn.disabled = true;
  try {
    const r = await fetch('/quiz', {method:'POST', headers: hdr({'Content-Type':'application/json'}), body: JSON.stringify({session_id: sid, sources: selectedIds()})});
    if(r.status === 400){ alert('조금 더 대화한 뒤에 퀴즈를 볼 수 있어요'); return; }
    if(!r.ok){ alert('퀴즈를 불러오지 못했어요 (' + r.status + ')'); return; }
    currentQuiz = await r.json();
    renderQuiz(currentQuiz);
    quizEl.classList.add('open');
  } catch(e){ alert('퀴즈 요청 실패: ' + e); }
  finally { btn.disabled = false; }
}

function renderQuiz(quiz){
  document.getElementById('score').textContent = '';
  const submit = document.getElementById('quizsubmit');
  submit.style.display = ''; submit.disabled = false;
  quizBody.innerHTML = '';
  quiz.questions.forEach((qn, i) => {
    const card = document.createElement('div'); card.className = 'qcard'; card.dataset.qi = i;
    const opts = qn.options.map((o, j) =>
      `<label class="opt"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`
    ).join('');
    card.innerHTML =
      `<div class="qnum">문제 ${i+1}</div>`+
      `<div class="qtext">${esc(qn.question)}</div>`+
      (qn.source ? `<div class="qsrc">출처: ${esc(qn.source)}</div>` : '')+
      opts +
      `<div class="qresult"></div>`;
    quizBody.appendChild(card);
  });
  quizBody.scrollTop = 0;
}

async function gradeQuiz(){
  if(!currentQuiz) return;
  const answers = currentQuiz.questions.map((qn, i) => {
    const sel = quizBody.querySelector(`input[name="q${i}"]:checked`);
    return sel ? parseInt(sel.value, 10) : -1; // ponytail: -1 unanswered -> backend counts wrong
  });
  const submit = document.getElementById('quizsubmit'); submit.disabled = true;
  try {
    const r = await fetch('/quiz/grade', {method:'POST', headers: hdr({'Content-Type':'application/json'}),
      body: JSON.stringify({session_id: getSession(), quiz_id: currentQuiz.quiz_id, answers})});
    // ponytail: grading changes mastery, so refresh the overlay after
    refreshMastery();
    if(!r.ok){ alert('채점 실패 (' + r.status + ')'); submit.disabled = false; return; }
    const res = await r.json();
    showQuizResults(res);
  } catch(e){ alert('채점 요청 실패: ' + e); submit.disabled = false; }
}

function showQuizResults(res){
  document.getElementById('score').textContent = `${res.score} / ${res.total} 정답`;
  document.getElementById('quizsubmit').style.display = 'none';
  res.results.forEach((rr, i) => {
    const card = quizBody.querySelector(`.qcard[data-qi="${i}"]`);
    if(!card) return;
    const labels = card.querySelectorAll('.opt');
    labels.forEach((lab, j) => {
      lab.querySelector('input').disabled = true;
      const chosen = lab.querySelector('input').checked;
      if(j === rr.correct_index) lab.classList.add('correct');
      else if(chosen) lab.classList.add('wrong');
    });
    const box = card.querySelector('.qresult');
    const mark = rr.correct ? '<span class="mark ok">✓ 정답</span>' : '<span class="mark no">✗ 오답</span>';
    box.innerHTML =
      mark +
      (rr.explanation ? `<div class="exp">${esc(rr.explanation)}</div>` : '') +
      (rr.concept_id ? `<span class="review-link">🔗 복습: 이 개념 보기</span>` : '');
    const link = box.querySelector('.review-link');
    if(link) link.onclick = () => review(rr.concept_id);
  });
}

function review(conceptId){
  closeQuiz();
  focusConcept(conceptId);
}

// ---- Concept graph (Obsidian-style growing map) ----
let cy = null;
// Full graph is kept in JS refs only; cytoscape starts empty and grows via revealConcepts().
let ALL_NODES = [], ALL_EDGES = [], NODE_BY_ID = {};
const shownIds = new Set();
const addedEdges = new Set(); // "source|target" keys already drawn

function updateGraphEmpty(){
  const e = document.getElementById('graphempty');
  if(e) e.style.display = shownIds.size ? 'none' : 'flex';
}

// Reveal concept nodes as they're studied: fade/scale in + connect ready edges + gentle re-layout.
function revealConcepts(ids){
  if(!cy || !ids || !ids.length) return;
  let added = false;
  ids.forEach(id => {
    if(shownIds.has(id) || !NODE_BY_ID[id]) return;
    shownIds.add(id); added = true;
    const n = cy.add({ group:'nodes', data:{ ...NODE_BY_ID[id], deg:0 } });
    n.style('opacity', 0);
    n.animate({ style:{ opacity:1 } }, { duration:450, complete:()=>n.removeStyle('opacity') });
    n.addClass('justadded');                       // brief pop-glow on birth
    setTimeout(()=>n.removeClass('justadded'), 1300);
  });
  if(!added) return; // guard: don't restart physics when nothing new appeared
  ALL_EDGES.forEach(e => {
    const key = e.source + '|' + e.target;
    if(addedEdges.has(key)) return;
    if(shownIds.has(e.source) && shownIds.has(e.target)){
      addedEdges.add(key);
      cy.add({ group:'edges', data:{ source:e.source, target:e.target, label:e.relation } });
    }
  });
  cy.nodes().forEach(n => n.data('deg', n.degree()));  // hubs grow bigger (Obsidian-style)
  runPhysics(true);                                    // organic force settle + reframe
  updateGraphEmpty();
}

// Force layout that animates to an organic rest (looks alive as it settles), then stops.
// refit=true reframes the camera afterward; drag-release re-settles in place (web ripples).
let physics = null;
function runPhysics(refit){
  if(!cy || typeof cy.layout !== 'function') return;
  if(physics){ try{ physics.stop(); }catch(e){} }
  const reframe = () => { if(refit) cy.animate({ fit:{ eles:cy.nodes(), padding:70 } },
                                               { duration:500, easing:'ease-in-out-cubic' }); };
  try {
    physics = cy.layout({ name:'cola', infinite:false, fit:false, animate:true,
      maxSimulationTime:2000, nodeSpacing:22, edgeLength:100,
      handleDisconnected:true, avoidOverlap:true, randomize:false });
    physics.one('layoutstop', reframe);
    physics.run();
  } catch(e){                                   // cola missing → fall back to a one-shot cose
    cy.layout({ name:'cose', animate:true, animationDuration:500, nodeRepulsion:120000,
      idealEdgeLength:200, gravity:0.12 }).run();
    setTimeout(reframe, 550);
  }
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); }

// Relation label (edge.relation) -> short Korean tag for wikilinks.
const REL_KO = { related_to:'관련', part_of:'부분', builds_on:'기반', uses:'사용', enables:'가능', compared_with:'대비' };
// Wiki-style: neighbors of a concept from the graph edges -> clickable [[wikilinks]].
function relatedConcepts(id){
  const seen = new Set(), out = [];
  ALL_EDGES.forEach(e => {
    let other = null, rel = e.relation;
    if(e.source === id) other = e.target; else if(e.target === id) other = e.source;
    if(!other || seen.has(other) || !NODE_BY_ID[other]) return;
    seen.add(other);
    out.push({ id: other, label: NODE_BY_ID[other].label || other, rel });
  });
  return out.slice(0, 10);
}
// Mastery status of a concept, read from the live node's classes.
function conceptStatus(node){
  if(!node || !node.length) return { key:'new', label:'아직 안 배움' };
  if(node.hasClass('m-known')) return { key:'known', label:'이해 완료' };
  if(node.hasClass('m-due'))   return { key:'due',   label:'복습 필요' };
  if(node.hasClass('m-learning')) return { key:'learning', label:'학습 중' };
  return { key:'new', label:'아직 안 배움' };
}

// Concept "wiki page": summary + related-concept wikilinks + sources + mastery + understood toggle.
function showPanel(d){
  const src = (d.sources||[]).map(s=>`<div>${esc(s)}</div>`).join('');
  const node = cy && cy.getElementById(d.id);
  const known = !!(node && node.length && node.hasClass('m-known'));
  const st = conceptStatus(node);
  const rel = relatedConcepts(d.id);
  const links = rel.map(r =>
    `<button type="button" class="wikilink" onclick="focusConcept('${esc(r.id)}')">`+
      `${esc(r.label)}<span class="rel">${esc(REL_KO[r.rel]||r.rel||'')}</span></button>`).join('');
  document.getElementById('panelbody').innerHTML =
    `<div class="kind">${esc(d.type||'개념')}</div><h2>${esc(d.label)}</h2>`+
    `<div class="wiki-status s-${st.key}">${esc(st.label)}</div>`+
    `<p>${esc(d.summary||'')}</p>`+
    (links?`<div class="wiki-sec"><strong>관련 개념</strong><div class="wikilinks">${links}</div></div>`:'')+
    (src?`<div class="src"><strong>출처</strong>${src}</div>`:'')+
    `<button type="button" class="understood${known?' on':''}" data-cid="${esc(d.id)}" onclick="markKnown(this)">`+
      `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`+
      `<span>${known?'이해 완료':'이해했어요'}</span></button>`;
  document.getElementById('panel').classList.remove('collapsed');
  document.getElementById('panel').classList.add('open');
}

// Self-attest understanding of a concept -> server promotes mastery -> node color flips.
async function markKnown(btn){
  const cid = btn.getAttribute('data-cid');
  const known = !btn.classList.contains('on');   // toggle
  btn.disabled = true;
  try {
    const r = await fetch('/mastery/mark', {
      method:'POST', headers: hdr({'Content-Type':'application/json'}),
      body: JSON.stringify({concept_id: cid, known})
    });
    if(!r.ok){ toast('저장 실패 (' + r.status + ')'); return; }
    const node = cy && cy.getElementById(cid);
    if(node && node.length){
      node.removeClass('m-known m-learning m-due');
      node.addClass(known ? 'm-known' : 'm-learning');
    }
    btn.classList.toggle('on', known);
    btn.querySelector('span').textContent = known ? '이해 완료' : '이해했어요';
    const badge = document.querySelector('#panelbody .wiki-status');
    if(badge && node && node.length){ const st = conceptStatus(node); badge.className = 'wiki-status s-'+st.key; badge.textContent = st.label; }
    toast(known ? '이해한 개념으로 표시했어요' : '표시를 해제했어요');
    refreshMastery();  // sync next_up / accumulated state
  } catch(e){ toast('저장 실패'); }
  finally { btn.disabled = false; }
}

// Highlight the given node ids; dim the rest. Empty/falsy -> clear all.
function highlightConcepts(ids){
  if(!cy) return;
  cy.nodes().removeClass('highlight dim');
  if(!ids || !ids.length) return;
  const set = new Set(ids);
  cy.nodes().forEach(n => n.addClass(set.has(n.id()) ? 'highlight' : 'dim'));
}

// Single-node focus: highlight, center, open its panel.
function focusConcept(id){
  if(!cy) return;
  if(!shownIds.has(id)) revealConcepts([id]); // grow the node in if it hasn't appeared yet
  const node = cy.getElementById(id);
  if(!node || node.empty()){ highlightConcepts([]); return; }
  highlightConcepts([id]);
  cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1) }, { duration: 400 });
  showPanel(node.data());
}

fetch('/graph').then(r=>r.json()).then(g=>{
  // Store full graph in refs only — cytoscape is initialized EMPTY and grows as concepts are studied.
  ALL_NODES = g.nodes || [];
  ALL_EDGES = g.edges || [];
  NODE_BY_ID = {}; ALL_NODES.forEach(n => { NODE_BY_ID[n.id] = n; });
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: [],
    minZoom: 0.35, maxZoom: 1.15,
    style: [
      { selector:'node', style:{
        'label':'data(label)', 'font-size':11, 'text-wrap':'wrap', 'text-max-width':120,
        'text-valign':'bottom', 'text-margin-y':7, 'color':'#c9c9d2',
        'text-outline-width':3, 'text-outline-color':'#16181c', 'font-weight':600,
        'background-color':'#cbd5e1',
        'width':'mapData(deg, 0, 6, 15, 34)', 'height':'mapData(deg, 0, 6, 15, 34)',
        'transition-property':'opacity, background-color, border-color, width, height',
        'transition-duration':'160ms' } },
      { selector:'edge', style:{
        'label':'data(label)', 'font-size':9, 'color':'#cfcfd6', 'text-opacity':0,
        'text-background-color':'#1e2126', 'text-background-opacity':0.8, 'text-background-padding':2,
        'curve-style':'bezier', 'line-color':'#3f4550', 'width':1.2, 'opacity':0.7,
        'transition-property':'opacity, line-color, width', 'transition-duration':'160ms' } },
      // mastery (monochrome): known=filled bright, learning=hollow outline, due=dashed ring
      { selector:'node.m-learning', style:{ 'background-color':'#22252b', 'border-width':2, 'border-color':'#8b919d', 'color':'#cfcfd6' } },
      { selector:'node.m-known', style:{ 'background-color':'#e9eaee', 'border-width':2, 'border-color':'#e9eaee' } },
      { selector:'node.m-due', style:{ 'border-width':2, 'border-color':'#e9eaee', 'border-style':'dashed' } },
      // chat-active concepts: bright white, enlarged, soft glow
      { selector:'node.highlight', style:{
        'background-color':'#e9eaee', 'border-width':3, 'border-color':'#e9eaee',
        'width':26, 'height':26, 'color':'#e9eaee', 'z-index':10,
        'overlay-color':'#e9eaee', 'overlay-opacity':0.16, 'overlay-padding':10 } },
      { selector:'node.dim', style:{ 'opacity':0.3 } },
      { selector:'edge.dim', style:{ 'opacity':0.08 } },
      // just-revealed pop-glow
      { selector:'node.justadded', style:{ 'overlay-color':'#e9eaee', 'overlay-opacity':0.32, 'overlay-padding':12 } },
      // hover neighborhood focus
      { selector:'.faded', style:{ 'opacity':0.1 } },
      { selector:'node.nbr', style:{ 'opacity':1 } },
      { selector:'node.nbrhub', style:{ 'background-color':'#e9eaee', 'border-width':3, 'border-color':'#e9eaee', 'width':30, 'height':30, 'color':'#e9eaee', 'z-index':20 } },
      { selector:'edge.nbr', style:{ 'opacity':1, 'line-color':'#e9eaee', 'width':2, 'text-opacity':1,
        'line-style':'dashed', 'line-dash-pattern':[6,5] } }
    ]
  });
  cy.on('tap','node', e => showPanel(e.target.data()));
  // hover: spotlight the node + its neighbors, fade the rest, reveal relation labels
  cy.on('mouseover','node', e => {
    const n = e.target;
    cy.elements().addClass('faded');
    n.closedNeighborhood().removeClass('faded').addClass('nbr');
    n.addClass('nbrhub');
    document.getElementById('cy').style.cursor = 'pointer';
  });
  cy.on('mouseout','node', e => {
    cy.elements().removeClass('faded nbr nbrhub');
    document.getElementById('cy').style.cursor = '';
  });
  // drag a node and the connected web re-settles around it (no reframe, camera stays put)
  cy.on('dragfree','node', () => runPhysics(false));
  // energy flowing along the highlighted connections
  let dash = 0;
  (function flow(){ if(cy){ dash = (dash - 0.7); cy.edges('.nbr').style('line-dash-offset', dash); } requestAnimationFrame(flow); })();
  updateGraphEmpty();
  refreshMastery(); // re-reveal accumulated concepts + apply mastery once the graph exists
});

// ---- Mastery overlay + "다음에 공부할 개념" ----
function applyMastery(m){
  if(!cy) return;
  cy.nodes().removeClass('m-known m-learning m-due');
  Object.entries(m || {}).forEach(([id, info]) => {
    const n = cy.getElementById(id);
    if(!n || n.empty()) return;
    if(info.level === 'known') n.addClass('m-known');
    else if(info.level === 'learning') n.addClass('m-learning');
    if(info.due) n.addClass('m-due');
  });
}

function renderNextUp(items){
  const box = document.getElementById('nextup');
  items = items || [];
  const st = document.querySelector('.tab[data-tab="study"]');
  if(!items.length){ box.style.display='none'; box.innerHTML=''; return; }
  if(st && !st.classList.contains('active')) st.classList.add('hasdot'); // subtle badge on 학습 tab
  box.style.display='block'; box.innerHTML='<div class="nu-title">다음에 공부할 개념</div>';
  items.forEach(it => {
    const el = document.createElement('div'); el.className='nu-item';
    el.innerHTML = `<strong>${esc(it.label||'')}</strong>` + (it.reason ? `<span>${esc(it.reason)}</span>` : '');
    el.onclick = () => {
      focusConcept(it.concept_id);
      document.getElementById('q').value = `${it.label}에 대해 설명해줘`;
    };
    box.appendChild(el);
  });
}

function renderDashboard(d){
  const box = document.getElementById('dashboard');
  if(!d){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  const tile = (v, label) => `<div class="dash-tile"><b>${v}</b><span>${label}</span></div>`;
  box.innerHTML =
    `<div class="dash-score"><b>${d.learning_score}</b><span>학습 점수<br>퀴즈정답×10 + 이해완료×5 + 연속일×5</span></div>` +
    '<div class="dash-grid">' +
    tile(d.progress_pct + '%', '학습 진척률') +
    tile(d.avg_score + '%', '평균 숙련도') +
    tile((d.quiz_attempts ? d.quiz_accuracy + '%' : '—'), '퀴즈 정답률') +
    tile(d.due_count, '복습 대기') +
    tile(d.concepts_learned, '학습한 개념') +
    tile(d.streak_days + '일', '연속 학습') +
    '</div>';
}

async function refreshMastery(){
  try {
    const r = await fetch('/mastery', { headers: hdr() });
    if(!r.ok) return;
    const d = await r.json();
    revealConcepts(Object.keys(d.mastery || {})); // re-reveal a returning user's accumulated concepts
    applyMastery(d.mastery || {});
    renderNextUp(d.next_up || []);
    const rd = await fetch('/dashboard', { headers: hdr() });
    if(rd.ok) renderDashboard(await rd.json());
  } catch(e){ /* non-fatal */ }
}

// ---- 원문 뷰어: 인용 -> 그 페이지의 추출 텍스트 + 인용 구절 하이라이트 ----
const viewerEl = document.getElementById('viewer');
let VIEW = { sid: null, page: 1, total: 0, quote: '' };

const normWs = s => (s || '').replace(/\s+/g, ' ').trim();

// 인용문(cited_text)은 모델이 PDF에서 읽은 것이고, 뷰어 텍스트는 pypdf 추출본이라
// 글자가 정확히 일치하지 않는다. 앞에서부터 조금씩 짧게 잘라가며 겹치는 구간을 찾는다.
function findQuote(text, quote){
  const T = text, Q = normWs(quote).replace(/^[.…\s]+|[.…\s]+$/g, '');
  if(!Q) return null;
  for(let len = Q.length; len >= 20; len = Math.floor(len * 0.7)){
    const i = T.indexOf(Q.slice(0, len));
    if(i !== -1) return [i, i + len];
  }
  return null;
}

async function openViewer(sid, page, quote){
  if(!sid){ toast('이 인용은 원문 위치를 알 수 없어요'); return; }
  VIEW = { sid, page: page || 1, total: 0, quote: quote || VIEW.quote };
  viewerEl.classList.add('open');
  document.getElementById('vbody').innerHTML = '<div class="empty">불러오는 중…</div>';
  await loadViewerPage();
  document.getElementById('vclose').focus();
}

async function loadViewerPage(){
  const body = document.getElementById('vbody');
  try {
    const r = await fetch(`/corpus/${encodeURIComponent(VIEW.sid)}/page/${VIEW.page}`, { headers: hdr() });
    if(!r.ok){ body.innerHTML = `<div class="empty">${esc(await errText(r, '원문을 불러오지 못했어요'))}</div>`; return; }
    const d = await r.json();
    VIEW.total = d.total_pages;
    document.getElementById('vtitle').textContent = d.title;
    document.getElementById('vpage').textContent = `${d.page} / ${d.total_pages}쪽`;
    document.getElementById('vprev').disabled = d.page <= 1;
    document.getElementById('vnext').disabled = d.page >= d.total_pages;
    const text = normWs(d.text) || '(이 쪽에서 추출된 텍스트가 없어요 — 이미지만 있는 쪽일 수 있어요)';
    const hit = findQuote(text, VIEW.quote);
    body.innerHTML = hit
      ? esc(text.slice(0, hit[0])) + '<mark>' + esc(text.slice(hit[0], hit[1])) + '</mark>' + esc(text.slice(hit[1]))
      : esc(text);
    if(VIEW.quote && !hit){
      body.insertAdjacentHTML('afterbegin',
        '<div class="vnote">인용 구절을 이 쪽에서 그대로 찾지 못했어요 (추출 텍스트와 표기가 다를 수 있어요)</div>');
    }
    const m = body.querySelector('mark');
    if(m) m.scrollIntoView({ block:'center' }); else body.scrollTop = 0;
  } catch(e){ body.innerHTML = '<div class="empty">원문을 불러오지 못했어요.</div>'; }
}

function closeViewer(){ viewerEl.classList.remove('open'); }
document.getElementById('vclose').onclick = closeViewer;
document.getElementById('vprev').onclick = () => { if(VIEW.page > 1){ VIEW.page--; loadViewerPage(); } };
document.getElementById('vnext').onclick = () => { if(VIEW.page < VIEW.total){ VIEW.page++; loadViewerPage(); } };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && viewerEl.classList.contains('open')) closeViewer(); });

// ---- 각주 호버 미리보기 ----
const citePop = document.getElementById('citepop');
function showCitePop(el, c){
  const page = c.start_page ? `p.${c.start_page}${c.end_page && c.end_page !== c.start_page ? '–'+c.end_page : ''}` : '';
  const quote = (c.cited_text || '').trim();
  citePop.innerHTML = `<b>${esc(`${c.title||''} ${page}`.trim())}</b>` +
    (quote ? `“${esc(quote.slice(0, 300))}${quote.length > 300 ? '…' : ''}”` : '(인용 구절 없음)') +
    (c.source_id ? '<b style="margin:6px 0 0">클릭하면 원문 쪽이 열려요</b>' : '');
  citePop.classList.add('show');
  const r = el.getBoundingClientRect(), p = citePop.getBoundingClientRect();
  citePop.style.left = Math.max(8, Math.min(r.left, innerWidth - p.width - 8)) + 'px';
  citePop.style.top = (r.top > p.height + 12 ? r.top - p.height - 8 : r.bottom + 8) + 'px';
}
function hideCitePop(){ citePop.classList.remove('show'); }

// ---- 소스 목록 + 선택 ----
let SOURCES = [];  // [{id, title, mine, added_at}] as returned by GET /corpus
let SRC_MAX = 0;   // 사용자당 업로드 상한 (서버 설정)

// rp_sources = 명시적으로 선택된 id 배열. 키가 없으면 "전부 선택" (기본값).
// ponytail: null=전체 이므로 새로 올라온 논문은 자동으로 체크된 상태가 된다.
function getSelected(){
  try { const v = JSON.parse(localStorage.getItem('rp_sources')); return Array.isArray(v) ? v : null; }
  catch(e){ return null; }
}
function setSelected(ids){ localStorage.setItem('rp_sources', JSON.stringify(ids)); }
function selectedIds(){
  const sel = getSelected(), all = SOURCES.map(s => s.id);
  return sel === null ? all : all.filter(id => sel.includes(id));
}

async function loadSources(){
  const body = document.getElementById('sourcesbody');
  const prev = new Set(SOURCES.map(s => s.id));
  try {
    const r = await fetch('/corpus', { headers: hdr() });
    if(!r.ok){ body.innerHTML = '<div class="empty">소스를 불러오지 못했어요.</div>'; return; }
    const d = await r.json();
    SOURCES = d.sources || [];
    SRC_MAX = d.max_sources || 0;
    const sel = getSelected();
    if(sel && prev.size){  // 선택을 이미 손댄 상태라면, 새로 올라온 소스는 체크해서 들어온다
      const fresh = SOURCES.map(s => s.id).filter(id => !prev.has(id));
      if(fresh.length) setSelected([...sel, ...fresh]);
    }
    renderSources();
    refreshSuggestions();
  } catch(e){ body.innerHTML = '<div class="empty">소스를 불러오지 못했어요.</div>'; }
}

let SRC_PENDING = null;   // {title} — 업로드 처리 중인 가짜 행
let SRC_ERROR = '';       // 소스 패널 상단에 띄울 실패 사유

const SRC_SORTS = {
  added: (a, b) => (a.added_at || 0) - (b.added_at || 0),
  title: (a, b) => a.title.localeCompare(b.title, 'ko'),
  mine:  (a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0) || a.title.localeCompare(b.title, 'ko'),
};
function sortedSources(){
  const key = document.getElementById('srcsort').value;
  return [...SOURCES].sort(SRC_SORTS[key] || SRC_SORTS.added);
}

function renderSources(){
  const body = document.getElementById('sourcesbody');
  const on = new Set(selectedIds());
  const owned = SOURCES.filter(s => s.mine).length;
  const countEl = document.getElementById('srccount');
  countEl.textContent = `${on.size}/${SOURCES.length}편` + (SRC_MAX ? ` · 내 ${owned}/${SRC_MAX}` : '');
  countEl.title = `${SOURCES.length}편 중 ${on.size}편 선택` +
    (SRC_MAX ? ` · 내 업로드 ${owned}/${SRC_MAX}편` : '');   // 줄인 문구의 원문은 툴팁에
  // 전체선택/전체해제 버튼 2개를 체크박스 1개로 합쳤다. 일부만 골랐으면 중간 상태.
  const allbox = document.getElementById('srctoggleall');
  allbox.checked = SOURCES.length > 0 && on.size === SOURCES.length;
  allbox.indeterminate = on.size > 0 && on.size < SOURCES.length;
  body.innerHTML = '';
  if(SRC_ERROR) body.insertAdjacentHTML('beforeend', `<div class="srcerr">${esc(SRC_ERROR)}</div>`);
  if(SRC_PENDING){
    body.insertAdjacentHTML('beforeend',
      `<div class="srcitem pending"><input type="checkbox" disabled>`+
      `<div class="stitle">${esc(SRC_PENDING.title)}</div><span class="sbadge">업로드</span></div>`);
  }
  if(!SOURCES.length && !SRC_PENDING){
    body.insertAdjacentHTML('beforeend',
      '<div class="empty">아직 소스가 없어요. “논문 추가”로 PDF를 올려보세요.</div>');
    return;
  }
  sortedSources().forEach(s => {
    const row = document.createElement('div');
    row.className = 'srcitem' + (on.has(s.id) ? '' : ' off'); row.dataset.id = s.id;
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = on.has(s.id);
    cb.setAttribute('aria-label', s.title);
    cb.onchange = onSourceToggle;
    row.appendChild(cb);
    row.insertAdjacentHTML('beforeend',
      `<div class="stitle" title="${esc(s.title)}">${esc(s.title)}</div>` +
      `<span class="sbadge">${s.mine ? '내 업로드' : '공용'}</span>` +
      // 공용 논문은 남들도 보는 것이라 이름 변경·삭제 버튼 자체를 주지 않는다
      (s.mine ? `<span class="srcact"><span class="ren" title="이름 바꾸기">✎</span>`+
                `<span class="del" title="삭제">🗑</span></span>` : ''));
    if(s.mine){
      row.querySelector('.ren').onclick = () => startRename(row, s);
      row.querySelector('.del').onclick = () => deleteSource(s);
    }
    body.appendChild(row);
  });
}

function onSourceToggle(){
  const ids = [...document.querySelectorAll('#sourcesbody .srcitem:not(.pending)')]
    .filter(r => r.querySelector('input').checked).map(r => r.dataset.id);
  setSelected(ids);
  renderSources();
  refreshSuggestions();
}

// 인라인 이름 바꾸기: 제목을 입력창으로 바꾸고 Enter 저장 / Esc 취소.
function startRename(row, s){
  const cell = row.querySelector('.stitle');
  const input = document.createElement('input');
  input.className = 'srcrename'; input.value = s.title; input.maxLength = 200;
  cell.replaceWith(input); input.focus(); input.select();
  const cancel = () => renderSources();
  input.onkeydown = e => {
    if(e.key === 'Enter') commit();
    else if(e.key === 'Escape') cancel();
  };
  input.onblur = cancel;
  async function commit(){
    const name = input.value.trim();
    input.onblur = null;
    if(!name || name === s.title) return cancel();
    try {
      const r = await fetch('/corpus/' + encodeURIComponent(s.id), {
        method:'PATCH', headers: hdr({'Content-Type':'application/json'}),
        body: JSON.stringify({name})
      });
      if(!r.ok){ SRC_ERROR = await errText(r, '이름을 바꾸지 못했어요'); renderSources(); return; }
      toast('이름을 바꿨어요');
      await loadSources();
    } catch(e){ SRC_ERROR = '이름을 바꾸지 못했어요 (네트워크)'; renderSources(); }
  }
}

async function deleteSource(s){
  if(!confirm(`"${s.title}"을(를) 삭제할까요? 이 소스를 근거로 한 이후 답변에서 빠집니다.`)) return;
  try {
    const r = await fetch('/corpus/' + encodeURIComponent(s.id), { method:'DELETE', headers: hdr() });
    if(!r.ok){ SRC_ERROR = await errText(r, '삭제하지 못했어요'); renderSources(); return; }
    const sel = getSelected();
    if(sel) setSelected(sel.filter(id => id !== s.id));  // 선택 목록에서도 같이 빠진다
    SRC_ERROR = '';
    toast('소스를 삭제했어요');
    await loadSources();
  } catch(e){ SRC_ERROR = '삭제하지 못했어요 (네트워크)'; renderSources(); }
}

// 서버가 준 사유를 그대로 보여준다 — "실패 (409)"보다 "최대 50편" 쪽이 고칠 수 있는 정보다.
async function errText(r, fallback){
  try { const d = await r.json(); if(d.detail) return d.detail; } catch(e){}
  return `${fallback} (${r.status})`;
}

async function openNotes(){

      card.innerHTML = `<div class="ntext">${esc(nt.text||'')}</div>` + (meta ? `<div class="nmeta">${meta}</div>` : '');

async function exportNotes(){
  try {
    const r = await fetch('/notes/export', { headers: hdr() });
    if(!r.ok){ toast('내보내기 실패 (' + r.status + ')'); return; }
    const blob = await r.blob();
    let fn = 'notes.md';
    const cd = r.headers.get('Content-Disposition');
    if(cd){ const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^\";]+)"?/i); if(m) fn = decodeURIComponent(m[1]); }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fn;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  } catch(e){ toast('내보내기 실패'); }
}

async function doUpload(){
  const f = document.getElementById('upfile').files[0];
  const title = document.getElementById('uptitle').value.trim();
  const st = document.getElementById('upstatus');
  if(!f){ st.textContent='PDF 파일을 선택하세요.'; return; }
  if(!/\.pdf$/i.test(f.name)){ st.textContent='PDF 파일만 추가할 수 있어요.'; return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('title', title || f.name);
  const btn = document.getElementById('upsubmit'); btn.disabled = true; st.textContent='업로드 중…';
  SRC_ERROR = ''; SRC_PENDING = { title: title || f.name }; renderSources();  // 목록에 "처리 중" 행
  try {
    const r = await fetch('/upload', { method:'POST', headers: hdr(), body: fd });
    if(!r.ok){
      const msg = await errText(r, '업로드 실패');
      st.textContent = msg; SRC_ERROR = msg; return;
    }
    const d = await r.json();
    st.textContent = `논문 추가됨 · 코퍼스 ${d.corpus_size}편 · 내 업로드 ${d.owned}/${d.max_sources}`;
    toast(`논문 추가됨 · 코퍼스 ${d.corpus_size}편 · 내 업로드 ${d.owned}/${d.max_sources}`);
    document.getElementById('upfile').value=''; document.getElementById('uptitle').value='';
  } catch(e){ st.textContent='업로드 실패 (네트워크)'; SRC_ERROR='업로드 실패 (네트워크)'; }
  finally {
    btn.disabled = false;
    SRC_PENDING = null;
    await loadSources();  // 소스 목록에 즉시 반영 (새로고침 없이)
  }
}

function shortTime(s){
  if(!s) return '';
  // 서버의 updated_at은 epoch '초'인데 Date()는 밀리초로 읽는다. 그대로 넣으면
  // 2026년이 1970-01-21이 되어 모든 대화가 "1/22"로 찍혔다.
  const t = (typeof s === 'number' || /^\d+(\.\d+)?$/.test(s))
    ? new Date(Number(s) * (Number(s) < 1e12 ? 1000 : 1))
    : new Date(s);
  if(isNaN(t)) return String(s).slice(0, 16).replace('T', ' ');
  const diff = (Date.now() - t.getTime()) / 1000;
  if(diff < 60) return '방금';
  if(diff < 3600) return Math.floor(diff/60) + '분 전';
  if(diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if(diff < 604800) return Math.floor(diff/86400) + '일 전';
  return `${t.getMonth()+1}/${t.getDate()}`;
}

// 검색어 안의 매치를 <mark>로 감싼다. esc() 후에 감싸야 하므로 순서에 주의.
function markHit(text, q){
  const s = esc(text || '');
  if(!q) return s;
  const i = s.toLowerCase().indexOf(esc(q).toLowerCase());
  if(i < 0) return s;
  const n = esc(q).length;
  return s.slice(0, i) + '<mark>' + s.slice(i, i + n) + '</mark>' + s.slice(i + n);
}

async function loadConversations(){
  const body = document.getElementById('historybody');
  const q = (document.getElementById('convsearch').value || '').trim();
  body.innerHTML = '<div class="empty">불러오는 중…</div>';
  try {

    if(!r.ok){ body.innerHTML = '<div class="empty">기록을 불러오지 못했어요.</div>'; return; }
    const d = await r.json();
    const convs = d.conversations || [];
    if(!convs.length){
      body.innerHTML = q
        ? `<div class="empty">“${esc(q)}”가 들어간 대화가 없어요.</div>`
        : '<div class="empty">아직 대화 기록이 없어요.</div>';
      return;
    }
    body.innerHTML = '';
    const cur = getConv();
    convs.forEach(c => {
      const card = document.createElement('div');
      card.className = 'convcard' + (c.id === cur ? ' active' : '');  // 현재 열린 대화만 활성 표시
      if(c.id === cur) card.setAttribute('aria-current', 'true');
      card.innerHTML =
        `<div class="cmain"><div class="ctitle">${markHit(c.title || '(제목 없음)', q)}</div>`+
        `<div class="cmeta">${esc(shortTime(c.updated_at))} · ${c.msg_count||0}개 메시지</div>`+
        // 검색 결과에는 매치된 문장 조각을 한 줄 붙인다 — 제목만으로는 왜 걸렸는지 모른다
        (c.snippet ? `<div class="csnip">${markHit(c.snippet, q)}</div>` : '')+
        `</div><div class="cdel" title="삭제">🗑</div>`;
      card.querySelector('.cmain').onclick = () => resumeConversation(c.id, c.title);
      card.querySelector('.cdel').onclick = (e) => { e.stopPropagation(); deleteConversation(c.id); };
      body.appendChild(card);
    });
  } catch(e){ body.innerHTML = '<div class="empty">기록을 불러오지 못했어요.</div>'; }
}

// 타이핑마다 요청하지 않는다 — 200ms 멈추면 한 번 보낸다.
let convSearchT = null;
document.getElementById('convsearch').addEventListener('input', () => {
  clearTimeout(convSearchT);
  convSearchT = setTimeout(loadConversations, 200);
});

// Resume: set conversation_id, CLEAR session_id (server rehydrates context from DB), replay messages.
async function resumeConversation(id, title){
  try {
    const r = await fetch('/conversations/' + encodeURIComponent(id), { headers: hdr() });
    if(!r.ok){ toast('대화를 불러오지 못했어요 (' + r.status + ')'); return; }
    const d = await r.json();
    localStorage.setItem('rp_conv', id);
    localStorage.removeItem('rp_session');
    RENDERED_CONV = id;
    setConvTitle(title || d.title);  // 딥링크로 들어오면 목록을 안 거치므로 서버 제목을 쓴다
    log.innerHTML = '';
    (d.messages || []).forEach(m => {
      if(m.role === 'user') addUser(m.content || '');
      else addBotReplay(m.content || '', m.meta);   // 각주·사용한 소스까지 복원
    });
    if(!(d.messages || []).length) log.innerHTML = '<div class="empty">빈 대화입니다.</div>';
    document.getElementById('quizbar').style.display = 'none';
    navigate('chat', id);   // 대화는 URL로 딥링크된다: /#/chat/{conversation_id}
  } catch(e){ toast('대화를 불러오지 못했어요'); }
}

// 저장된 답변을 다시 그린다. 각 인용의 offset(그 각주가 붙은 시점까지 온 글자 수)만큼
// 본문을 흘려보낸 뒤 각주를 찍으므로, 각주가 실시간 답변과 같은 자리에 붙는다.
// offset이 없는 옛 메시지는 예전처럼 끝에 모아 붙는다 (v5 이전 대화도 그대로 열린다).
function addBotReplay(text, meta){
  const bot = newBotBubble();
  if(meta && meta.sources) bot.usedSources(meta.sources);
  const cites = ((meta && meta.citations) || []).slice();
  const positioned = cites.filter(c => Number.isInteger(c.offset));
  if(!positioned.length){
    if(text) bot.text(text);
    cites.forEach(c => bot.citation(c));
  } else {
    positioned.sort((a, b) => a.offset - b.offset);
    let at = 0;
    positioned.forEach(c => {
      const cut = Math.max(at, Math.min(c.offset, text.length));
      if(cut > at) bot.text(text.slice(at, cut));
      bot.citation(c);
      at = cut;
    });
    if(at < text.length) bot.text(text.slice(at));
    cites.filter(c => !Number.isInteger(c.offset)).forEach(c => bot.citation(c)); // 섞여 있으면 나머지는 끝에
  }
  bot.done([]);
}

async function deleteConversation(id){
  try {
    const r = await fetch('/conversations/' + encodeURIComponent(id), { method:'DELETE', headers: hdr() });
    if(!r.ok){ toast('삭제 실패 (' + r.status + ')'); return; }
    if(getConv() === id) resetChat();  // 열려 있던 대화를 지웠으면 로그도 빈 새 대화로
    loadConversations();
    toast('삭제했어요');
  } catch(e){ toast('삭제 실패'); }
}

// ---- Analytics ----
const statsModal = document.getElementById('statsmodal');
document.getElementById('historystats').onclick = openStats;
document.getElementById('statsclose').onclick = () => statsModal.classList.remove('open');

async function openStats(){
  const body = document.getElementById('statsbody');
  body.innerHTML = '<div class="empty">불러오는 중…</div>';
  statsModal.classList.add('open');
  try {
    const r = await fetch('/analytics', { headers: hdr() });
    if(!r.ok){ body.innerHTML = '<div class="empty">통계를 불러오지 못했어요.</div>'; return; }
    const d = await r.json();
    const e = d.engagement || {};
    const cells = [
      ['사용자', e.users], ['기기', e.devices], ['대화', e.conversations],
      ['메시지', e.messages], ['노트', e.notes]
    ].filter(([,v]) => v != null)
     .map(([k,v]) => `<div class="cell"><b>${v}</b><span>${k}</span></div>`).join('');
    const cohort = (d.cohort_concepts || []).slice(0, 5).map(c =>
      `<div class="cohort-row"><span>${esc(c.concept_id||'')}</span>`+
      `<span>평균 ${Math.round((c.avg_score||0)*100)/100} · 학습자 ${c.learners||0}</span></div>`
    ).join('');
    body.innerHTML =
      `<div class="stat-grid">${cells}</div>` +
      (cohort ? `<div class="nu-title">코호트 상위 개념</div>${cohort}` : '');
  } catch(e){ body.innerHTML = '<div class="empty">통계를 불러오지 못했어요.</div>'; }
}
